services:
  - type: web
    name: tay-nam-vote-online
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tay-nam-vote-db
          property: connectionString
      - key: PUBLIC_URL
        fromService:
          type: web
          name: tay-nam-vote-online
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: tay-nam-vote-db
    region: singapore
    plan: free
    databaseName: tay_nam_vote
    user: taynam_admin
